[workspace]
resolver = "3"
members = ["crates/induckgo-core", "crates/induckgo", "crates/induckgo-test-report"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Release packages: one optimisation unit with link-time optimisation, symbols stripped.
[profile.release]
codegen-units = 1
lto = "fat"
strip = true
