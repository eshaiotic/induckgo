<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">How the Qt edition decides what may load and which connections may open</text>
<text x="40" y="92" font-size="15" font-weight="bold" fill="#374151">A request the page makes (image, script, fetch, navigation)</text>
<rect x="40" y="110" width="250" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="165.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Page</text>
<text x="165.0" y="166" font-size="12" text-anchor="middle" fill="#374151">&lt;img&gt;, &lt;script&gt;, fetch(),</text>
<text x="165.0" y="185" font-size="12" text-anchor="middle" fill="#374151">navigations</text>
<rect x="340" y="110" width="280" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="480.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Request interceptor (engine-qt)</text>
<text x="480.0" y="166" font-size="12" text-anchor="middle" fill="#374151">Chromium asks before</text>
<text x="480.0" y="185" font-size="12" text-anchor="middle" fill="#374151">every request is sent</text>
<rect x="670" y="110" width="480" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="910.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Request-policy chain (core)</text>
<text x="910.0" y="166" font-size="12" text-anchor="middle" fill="#374151">third party? → DuckDuckGo rules (faithful)</text>
<text x="910.0" y="185" font-size="12" text-anchor="middle" fill="#374151">→ stricter ad/analytics overlay → link</text>
<text x="910.0" y="204" font-size="12" text-anchor="middle" fill="#374151">cleaning → Guard filter lists → HTTPS upgrade</text>
<rect x="1200" y="110" width="260" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1330.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Pass / Block / Redirect</text>
<text x="1330.0" y="166" font-size="12" text-anchor="middle" fill="#374151">a Pass records the host</text>
<text x="1330.0" y="185" font-size="12" text-anchor="middle" fill="#374151">in the gate for 60 s</text>
<line x1="290" y1="170" x2="337" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="620" y1="170" x2="667" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1150" y1="170" x2="1197" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="314" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#374151">asks</text>
<text x="1175" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#374151"></text>
<text x="40" y="300" font-size="15" font-weight="bold" fill="#374151">A connection that never becomes a request (preconnect, dns-prefetch, speculative sockets)</text>
<rect x="40" y="320" width="250" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="165.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Page markup</text>
<text x="165.0" y="376" font-size="12" text-anchor="middle" fill="#374151">&lt;link rel=preconnect&gt;</text>
<text x="165.0" y="395" font-size="12" text-anchor="middle" fill="#374151">&lt;link rel=dns-prefetch&gt;</text>
<rect x="340" y="320" width="280" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="480.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Chromium network stack</text>
<text x="480.0" y="376" font-size="12" text-anchor="middle" fill="#374151">opens a socket before</text>
<text x="480.0" y="395" font-size="12" text-anchor="middle" fill="#374151">any request exists</text>
<rect x="670" y="320" width="330" height="120" rx="10" fill="#e0e7ff" stroke="#ea580c" stroke-dasharray="9 5" stroke-width="4"/>
<text x="835.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">GateProxy (engine-qt)</text>
<text x="835.0" y="376" font-size="12" text-anchor="middle" fill="#374151">local proxy 127.0.0.1:port</text>
<text x="835.0" y="395" font-size="12" text-anchor="middle" fill="#374151">every connection passes it</text>
<text x="835.0" y="414" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">HIGHEST RISK: fails closed</text>
<rect x="1130" y="320" width="330" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1295.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ConnectionGate (core)</text>
<text x="1295.0" y="376" font-size="12" text-anchor="middle" fill="#374151">admits a host if it was approved</text>
<text x="1295.0" y="395" font-size="12" text-anchor="middle" fill="#374151">in the last 60 s, or the request</text>
<text x="1295.0" y="414" font-size="12" text-anchor="middle" fill="#374151">policy would not block it</text>
<line x1="290" y1="380" x2="337" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="620" y1="380" x2="667" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1000" y1="380" x2="1127" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="1064" y="370" font-size="12" font-style="italic" text-anchor="middle" fill="#374151">admits(host)?</text>
<line x1="1330" y1="230" x2="1330" y2="317" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="1340" y="280" font-size="12" font-style="italic" text-anchor="start" fill="#374151">Pass: approve host</text>
<rect x="520" y="500" width="330" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="685.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Tunnel to the site</text>
<text x="685.0" y="556" font-size="12" text-anchor="middle" fill="#374151">direct, or through the proxy</text>
<text x="685.0" y="575" font-size="12" text-anchor="middle" fill="#374151">of the system environment</text>
<rect x="900" y="500" width="330" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1065.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">403, nothing leaves the PC</text>
<text x="1065.0" y="556" font-size="12" text-anchor="middle" fill="#374151">not even a DNS lookup</text>
<text x="1065.0" y="575" font-size="12" text-anchor="middle" fill="#374151">for the refused host</text>
<line x1="780" y1="440" x2="700" y2="497" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="710" y="470" font-size="12" font-style="italic" text-anchor="end" fill="#374151">yes</text>
<line x1="890" y1="440" x2="1000" y2="497" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="980" y="470" font-size="12" font-style="italic" text-anchor="start" fill="#374151">no</text>
<rect x="40" y="500" width="400" height="114" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="240.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Resource-hint script (page)</text>
<text x="240.0" y="556" font-size="12" text-anchor="middle" fill="#374151">removes preconnect, dns-prefetch, prefetch,</text>
<text x="240.0" y="575" font-size="12" text-anchor="middle" fill="#374151">prerender that scripts add; hints written</text>
<text x="240.0" y="594" font-size="12" text-anchor="middle" fill="#374151">in the HTML are caught by the gate</text>
<line x1="165" y1="497" x2="165" y2="443" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="175" y="475" font-size="12" font-style="italic" text-anchor="start" fill="#374151">added by scripts</text>
<text x="40" y="660" font-size="15" font-weight="bold" fill="#374151">Protection data: downloaded, cached on disk, swapped in while the browser runs</text>
<rect x="40" y="680" width="300" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="190.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DuckDuckGo and list sources</text>
<text x="190.0" y="736" font-size="12" text-anchor="middle" fill="#374151">tracker data, privacy config,</text>
<text x="190.0" y="755" font-size="12" text-anchor="middle" fill="#374151">nine filter lists</text>
<rect x="400" y="680" width="320" height="100" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="560.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">QtDocumentFetcher (engine-qt)</text>
<text x="560.0" y="736" font-size="12" text-anchor="middle" fill="#374151">QtNetwork, ETag, 20 s limit,</text>
<text x="560.0" y="755" font-size="12" text-anchor="middle" fill="#374151">no cookies</text>
<rect x="780" y="680" width="320" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="940.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ProtectionFeed (core)</text>
<text x="940.0" y="736" font-size="12" text-anchor="middle" fill="#374151">validates, writes atomically,</text>
<text x="940.0" y="755" font-size="12" text-anchor="middle" fill="#374151">keeps the last good copy</text>
<rect x="1160" y="680" width="300" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1310.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ProfilePolicies.use_documents</text>
<text x="1310.0" y="736" font-size="12" text-anchor="middle" fill="#374151">rebuilds rules and Guard engine,</text>
<text x="1310.0" y="755" font-size="12" text-anchor="middle" fill="#374151">swaps them in, no restart</text>
<line x1="340" y1="730" x2="397" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="720" y1="730" x2="777" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1100" y1="730" x2="1157" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="828" width="22" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="70" y="844" font-size="13" fill="#374151">core (no Qt)</text>
<rect x="228" y="828" width="22" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="258" y="844" font-size="13" fill="#374151">Qt adapter</text>
<rect x="398" y="828" width="22" height="22" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="428" y="844" font-size="13" fill="#374151">outside world</text>
<rect x="595" y="828" width="22" height="22" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="625" y="844" font-size="13" fill="#374151">allowed</text>
<rect x="738" y="828" width="22" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="768" y="844" font-size="13" fill="#374151">refused</text>
<rect x="881" y="828" width="22" height="22" rx="4" fill="#fff" stroke="#ea580c" stroke-width="3" stroke-dasharray="5 3"/>
<text x="911" y="844" font-size="13" fill="#374151">highest risk</text>
</svg>