<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">Jak edycja Qt decyduje, co może się wczytać i które połączenia mogą się otworzyć</text>
<text x="40" y="92" font-size="15" font-weight="bold" fill="#374151">Żądanie, które wysyła strona (obraz, skrypt, fetch, nawigacja)</text>
<rect x="40" y="110" width="250" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="165.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Strona</text>
<text x="165.0" y="166" font-size="12" text-anchor="middle" fill="#374151">&lt;img&gt;, &lt;script&gt;, fetch(),</text>
<text x="165.0" y="185" font-size="12" text-anchor="middle" fill="#374151">nawigacje</text>
<rect x="340" y="110" width="280" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="480.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Przechwytywacz żądań</text>
<text x="480.0" y="166" font-size="12" text-anchor="middle" fill="#374151">Chromium pyta, zanim</text>
<text x="480.0" y="185" font-size="12" text-anchor="middle" fill="#374151">wyśle każde żądanie</text>
<rect x="670" y="110" width="480" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="910.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Łańcuch polityk żądań (core)</text>
<text x="910.0" y="166" font-size="12" text-anchor="middle" fill="#374151">osoba trzecia? → reguły DuckDuckGo (wiernie)</text>
<text x="910.0" y="185" font-size="12" text-anchor="middle" fill="#374151">→ ostrzejsza nakładka reklam i analityki →</text>
<text x="910.0" y="204" font-size="12" text-anchor="middle" fill="#374151">czyszczenie linków → Guard → upgrade HTTPS</text>
<rect x="1200" y="110" width="260" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1330.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Pass / Block / Redirect</text>
<text x="1330.0" y="166" font-size="12" text-anchor="middle" fill="#374151">Pass zapisuje host</text>
<text x="1330.0" y="185" font-size="12" text-anchor="middle" fill="#374151">w bramce na 60 s</text>
<line x1="290" y1="170" x2="337" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="620" y1="170" x2="667" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1150" y1="170" x2="1197" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="314" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#374151">pyta</text>
<text x="1175" y="160" font-size="12" font-style="italic" text-anchor="middle" fill="#374151"></text>
<text x="40" y="300" font-size="15" font-weight="bold" fill="#374151">Połączenie, które nigdy nie staje się żądaniem (preconnect, dns-prefetch, gniazda spekulacyjne)</text>
<rect x="40" y="320" width="250" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="165.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Znaczniki strony</text>
<text x="165.0" y="376" font-size="12" text-anchor="middle" fill="#374151">&lt;link rel=preconnect&gt;</text>
<text x="165.0" y="395" font-size="12" text-anchor="middle" fill="#374151">&lt;link rel=dns-prefetch&gt;</text>
<rect x="340" y="320" width="280" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="480.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Stos sieciowy Chromium</text>
<text x="480.0" y="376" font-size="12" text-anchor="middle" fill="#374151">otwiera gniazdo, zanim</text>
<text x="480.0" y="395" font-size="12" text-anchor="middle" fill="#374151">powstanie jakiekolwiek żądanie</text>
<rect x="670" y="320" width="330" height="120" rx="10" fill="#e0e7ff" stroke="#ea580c" stroke-dasharray="9 5" stroke-width="4"/>
<text x="835.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">GateProxy (engine-qt)</text>
<text x="835.0" y="376" font-size="12" text-anchor="middle" fill="#374151">lokalne proxy 127.0.0.1:port,</text>
<text x="835.0" y="395" font-size="12" text-anchor="middle" fill="#374151">każde połączenie przez nie przechodzi</text>
<text x="835.0" y="414" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">NAJWYŻSZE RYZYKO: zamyka się domyślnie</text>
<rect x="1130" y="320" width="330" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1295.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ConnectionGate (core)</text>
<text x="1295.0" y="376" font-size="12" text-anchor="middle" fill="#374151">wpuszcza host zatwierdzony w ciągu</text>
<text x="1295.0" y="395" font-size="12" text-anchor="middle" fill="#374151">60 s albo taki, którego polityka</text>
<text x="1295.0" y="414" font-size="12" text-anchor="middle" fill="#374151">żądań by nie zablokowała</text>
<line x1="290" y1="380" x2="337" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="620" y1="380" x2="667" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1000" y1="380" x2="1127" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="1064" y="370" font-size="12" font-style="italic" text-anchor="middle" fill="#374151">wpuścić host?</text>
<line x1="1330" y1="230" x2="1330" y2="317" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="1340" y="280" font-size="12" font-style="italic" text-anchor="start" fill="#374151">Pass: zatwierdź host</text>
<rect x="520" y="500" width="330" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="685.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Tunel do serwisu</text>
<text x="685.0" y="556" font-size="12" text-anchor="middle" fill="#374151">bezpośrednio albo przez proxy</text>
<text x="685.0" y="575" font-size="12" text-anchor="middle" fill="#374151">ze środowiska systemu</text>
<rect x="900" y="500" width="330" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1065.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">403, nic nie opuszcza komputera</text>
<text x="1065.0" y="556" font-size="12" text-anchor="middle" fill="#374151">nawet zapytanie DNS</text>
<text x="1065.0" y="575" font-size="12" text-anchor="middle" fill="#374151">o odrzucony host</text>
<line x1="780" y1="440" x2="700" y2="497" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="710" y="470" font-size="12" font-style="italic" text-anchor="end" fill="#374151">tak</text>
<line x1="890" y1="440" x2="1000" y2="497" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="980" y="470" font-size="12" font-style="italic" text-anchor="start" fill="#374151">nie</text>
<rect x="40" y="500" width="400" height="114" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="240.0" y="530" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Skrypt podpowiedzi zasobów (strona)</text>
<text x="240.0" y="556" font-size="12" text-anchor="middle" fill="#374151">usuwa preconnect, dns-prefetch, prefetch,</text>
<text x="240.0" y="575" font-size="12" text-anchor="middle" fill="#374151">prerender dodawane przez skrypty; wpisane</text>
<text x="240.0" y="594" font-size="12" text-anchor="middle" fill="#374151">w HTML wyłapuje bramka</text>
<line x1="165" y1="497" x2="165" y2="443" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="175" y="475" font-size="12" font-style="italic" text-anchor="start" fill="#374151">dodane przez skrypty</text>
<text x="40" y="660" font-size="15" font-weight="bold" fill="#374151">Dane ochrony: pobierane, zapisane na dysku, podmieniane w działającej przeglądarce</text>
<rect x="40" y="680" width="300" height="100" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="190.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DuckDuckGo i źródła list</text>
<text x="190.0" y="736" font-size="12" text-anchor="middle" fill="#374151">dane trackerów, konfiguracja,</text>
<text x="190.0" y="755" font-size="12" text-anchor="middle" fill="#374151">dziewięć list filtrów</text>
<rect x="400" y="680" width="320" height="100" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="560.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">QtDocumentFetcher (engine-qt)</text>
<text x="560.0" y="736" font-size="12" text-anchor="middle" fill="#374151">QtNetwork, ETag, limit 20 s,</text>
<text x="560.0" y="755" font-size="12" text-anchor="middle" fill="#374151">bez ciasteczek</text>
<rect x="780" y="680" width="320" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="940.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ProtectionFeed (core)</text>
<text x="940.0" y="736" font-size="12" text-anchor="middle" fill="#374151">waliduje, zapisuje atomowo,</text>
<text x="940.0" y="755" font-size="12" text-anchor="middle" fill="#374151">zachowuje ostatnią dobrą kopię</text>
<rect x="1160" y="680" width="300" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1310.0" y="710" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ProfilePolicies.use_documents</text>
<text x="1310.0" y="736" font-size="12" text-anchor="middle" fill="#374151">przebudowuje reguły i silnik Guard,</text>
<text x="1310.0" y="755" font-size="12" text-anchor="middle" fill="#374151">podmienia je bez restartu</text>
<line x1="340" y1="730" x2="397" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="720" y1="730" x2="777" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1100" y1="730" x2="1157" y2="730" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="828" width="22" height="22" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="70" y="844" font-size="13" fill="#374151">core (bez Qt)</text>
<rect x="237" y="828" width="22" height="22" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="267" y="844" font-size="13" fill="#374151">adapter Qt</text>
<rect x="407" y="828" width="22" height="22" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="437" y="844" font-size="13" fill="#374151">świat zewnętrzny</text>
<rect x="631" y="828" width="22" height="22" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="661" y="844" font-size="13" fill="#374151">dozwolone</text>
<rect x="792" y="828" width="22" height="22" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="822" y="844" font-size="13" fill="#374151">odrzucone</text>
<rect x="953" y="828" width="22" height="22" rx="4" fill="#fff" stroke="#ea580c" stroke-width="3" stroke-dasharray="5 3"/>
<text x="983" y="844" font-size="13" fill="#374151">najwyższe ryzyko</text>
</svg>