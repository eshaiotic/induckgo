<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="380" viewBox="0 0 1500 380" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">Jak pobranie jest zapisywane i pokazywane</text>
<rect x="40" y="110" width="250" height="130" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="165" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">WebKit</text>
<text x="165" y="186" font-size="12" text-anchor="middle" fill="#374151">download-started</text>
<text x="165" y="205" font-size="12" text-anchor="middle" fill="#374151">decide-destination</text>
<line x1="290" y1="175" x2="327" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="330" y="110" width="250" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="455" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DownloadTracker</text>
<text x="455" y="186" font-size="12" text-anchor="middle" fill="#374151">proponuje bezpieczną nazwę,</text>
<text x="455" y="205" font-size="12" text-anchor="middle" fill="#374151">która niczego nie nadpisuje</text>
<line x1="580" y1="175" x2="617" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="620" y="110" width="250" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="745" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Pytać, gdzie zapisać?</text>
<text x="745" y="186" font-size="12" text-anchor="middle" fill="#374151">tak: okno zapisu</text>
<text x="745" y="205" font-size="12" text-anchor="middle" fill="#374151">nie: folder pobierania</text>
<line x1="870" y1="175" x2="907" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="910" y="110" width="250" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1035" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DownloadCenter</text>
<text x="1035" y="186" font-size="12" text-anchor="middle" fill="#374151">lista ostatnich (5) + ustawienia</text>
<text x="1035" y="205" font-size="12" text-anchor="middle" fill="#374151">powiadamia obserwatorów</text>
<line x1="1160" y1="175" x2="1197" y2="175" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1200" y="110" width="250" height="130" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1325" y="148" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">DownloadsList</text>
<text x="1325" y="186" font-size="12" text-anchor="middle" fill="#374151">okienko na pasku i pozycja</text>
<text x="1325" y="205" font-size="12" text-anchor="middle" fill="#374151">„Pobrane” w menu głównym</text>
<text x="40" y="290" font-size="13" fill="#374151">downloads.json pamięta ukończone pobrania; download-settings.json dwa wybory użytkownika</text>
<rect x="40" y="325" width="22" height="16" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="72" y="338" font-size="12" fill="#374151">WebKit / platforma</text>
<rect x="300" y="325" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="332" y="338" font-size="12" fill="#374151">logika decyzji</text>
<rect x="560" y="325" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="592" y="338" font-size="12" fill="#374151">stan i widok</text>
</svg>
