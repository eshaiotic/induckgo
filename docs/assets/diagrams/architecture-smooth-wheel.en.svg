<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">How a mouse-wheel step becomes a smooth scroll</text>
<text x="40" y="92" font-size="15" font-weight="bold" fill="#374151">Set up once per page load</text>
<rect x="40" y="110" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="190.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">SmoothWheelScroll (core)</text>
<text x="190.0" y="168" font-size="12" text-anchor="middle" fill="#374151">120 px per notch, 180 ms</text>
<text x="190.0" y="187" font-size="12" text-anchor="middle" fill="#374151">two curves: ease in-out</text>
<text x="190.0" y="206" font-size="12" text-anchor="middle" fill="#374151">and ease out (tested)</text>
<rect x="400" y="110" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="550.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">SmoothWheelScript (app)</text>
<text x="550.0" y="168" font-size="12" text-anchor="middle" fill="#374151">fills the numbers into</text>
<text x="550.0" y="187" font-size="12" text-anchor="middle" fill="#374151">smooth-wheel.js and wraps</text>
<text x="550.0" y="206" font-size="12" text-anchor="middle" fill="#374151">it as a user script</text>
<rect x="760" y="110" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="910.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">PageProtections (app)</text>
<text x="910.0" y="168" font-size="12" text-anchor="middle" fill="#374151">installs the script in every</text>
<text x="910.0" y="187" font-size="12" text-anchor="middle" fill="#374151">frame, in its own script</text>
<text x="910.0" y="206" font-size="12" text-anchor="middle" fill="#374151">world, next to Guard</text>
<rect x="1120" y="110" width="300" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1270.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ScrollingPreferences</text>
<text x="1270.0" y="168" font-size="12" text-anchor="middle" fill="#374151">scrolling.json per profile</text>
<text x="1270.0" y="187" font-size="12" text-anchor="middle" fill="#374151">Preferences → Appearance</text>
<text x="1270.0" y="206" font-size="12" text-anchor="middle" fill="#374151">on by default</text>
<line x1="340" y1="170" x2="397" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="700" y1="170" x2="757" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1120" y1="170" x2="1063" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="300" font-size="15" font-weight="bold" fill="#374151">What happens in the page at every wheel step</text>
<rect x="40" y="320" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="190.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Mouse wheel</text>
<text x="190.0" y="378" font-size="12" text-anchor="middle" fill="#374151">WebKitGTK wheel event</text>
<text x="190.0" y="397" font-size="12" text-anchor="middle" fill="#374151">deltaY 93, wheelDeltaY ±120</text>
<text x="190.0" y="416" font-size="12" text-anchor="middle" fill="#374151">a touchpad is not a notch</text>
<rect x="470" y="320" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="620.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">smooth-wheel.js decides</text>
<text x="620.0" y="378" font-size="12" text-anchor="middle" fill="#374151">whole notch? no Ctrl/Shift?</text>
<text x="620.0" y="397" font-size="12" text-anchor="middle" fill="#374151">not cancelled by the page?</text>
<text x="620.0" y="416" font-size="12" text-anchor="middle" fill="#374151">a scroller with room?</text>
<rect x="900" y="320" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1050.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Animation</text>
<text x="1050.0" y="378" font-size="12" text-anchor="middle" fill="#374151">cancel the event, then every</text>
<text x="1050.0" y="397" font-size="12" text-anchor="middle" fill="#374151">frame scrollTo(from + (target</text>
<text x="1050.0" y="416" font-size="12" text-anchor="middle" fill="#374151">− from) × curve(t))</text>
<line x1="340" y1="380" x2="467" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="770" y1="380" x2="897" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1050.0,440 v40 h-430 v-40" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="660.0" y="494" font-size="12" text-anchor="middle" fill="#374151">Next notch while moving: target moves on, ease-out curve</text>
<text x="40" y="540" font-size="13" fill="#374151">Other input (touchpad, keys, scrollbar) is left to WebKit; a scroll by someone else stops the animation.</text>
<rect x="40" y="568" width="22" height="16" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="72" y="581" font-size="12" fill="#374151">platform</text>
<rect x="360" y="568" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="392" y="581" font-size="12" fill="#374151">decision logic and numbers</text>
<rect x="680" y="568" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="712" y="581" font-size="12" fill="#374151">state and view</text>
</svg>
