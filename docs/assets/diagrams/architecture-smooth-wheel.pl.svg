<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="610" viewBox="0 0 1500 610" font-family="DejaVu Sans, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">Jak ząbek kółka myszy zamienia się w płynny scroll</text>
<text x="40" y="92" font-size="15" font-weight="bold" fill="#374151">Ustawiane raz przy każdym ładowaniu strony</text>
<rect x="40" y="110" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="190.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">SmoothWheelScroll (core)</text>
<text x="190.0" y="168" font-size="12" text-anchor="middle" fill="#374151">120 px na ząbek, 180 ms</text>
<text x="190.0" y="187" font-size="12" text-anchor="middle" fill="#374151">dwie krzywe: łagodny start</text>
<text x="190.0" y="206" font-size="12" text-anchor="middle" fill="#374151">i koniec oraz samo hamowanie</text>
<rect x="400" y="110" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="550.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">SmoothWheelScript (aplikacja)</text>
<text x="550.0" y="168" font-size="12" text-anchor="middle" fill="#374151">wpisuje liczby do</text>
<text x="550.0" y="187" font-size="12" text-anchor="middle" fill="#374151">smooth-wheel.js i pakuje</text>
<text x="550.0" y="206" font-size="12" text-anchor="middle" fill="#374151">go jako skrypt użytkownika</text>
<rect x="760" y="110" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="910.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">PageProtections (aplikacja)</text>
<text x="910.0" y="168" font-size="12" text-anchor="middle" fill="#374151">instaluje skrypt w każdej</text>
<text x="910.0" y="187" font-size="12" text-anchor="middle" fill="#374151">ramce, w osobnym świecie</text>
<text x="910.0" y="206" font-size="12" text-anchor="middle" fill="#374151">skryptów, obok Guarda</text>
<rect x="1120" y="110" width="300" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1270.0" y="140" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">ScrollingPreferences</text>
<text x="1270.0" y="168" font-size="12" text-anchor="middle" fill="#374151">scrolling.json w profilu</text>
<text x="1270.0" y="187" font-size="12" text-anchor="middle" fill="#374151">Preferencje → Wygląd</text>
<text x="1270.0" y="206" font-size="12" text-anchor="middle" fill="#374151">domyślnie włączone</text>
<line x1="340" y1="170" x2="397" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="700" y1="170" x2="757" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1120" y1="170" x2="1063" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="300" font-size="15" font-weight="bold" fill="#374151">Co dzieje się na stronie przy każdym ząbku kółka</text>
<rect x="40" y="320" width="300" height="120" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="190.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Kółko myszy</text>
<text x="190.0" y="378" font-size="12" text-anchor="middle" fill="#374151">zdarzenie wheel w WebKitGTK</text>
<text x="190.0" y="397" font-size="12" text-anchor="middle" fill="#374151">deltaY 93, wheelDeltaY ±120</text>
<text x="190.0" y="416" font-size="12" text-anchor="middle" fill="#374151">touchpad to nie ząbek</text>
<rect x="470" y="320" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="620.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">smooth-wheel.js decyduje</text>
<text x="620.0" y="378" font-size="12" text-anchor="middle" fill="#374151">pełny ząbek? bez Ctrl/Shift?</text>
<text x="620.0" y="397" font-size="12" text-anchor="middle" fill="#374151">strona nie anulowała?</text>
<text x="620.0" y="416" font-size="12" text-anchor="middle" fill="#374151">scroller ma miejsce?</text>
<rect x="900" y="320" width="300" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1050.0" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827">Animacja</text>
<text x="1050.0" y="378" font-size="12" text-anchor="middle" fill="#374151">anuluje zdarzenie, potem w</text>
<text x="1050.0" y="397" font-size="12" text-anchor="middle" fill="#374151">każdej klatce scrollTo(start +</text>
<text x="1050.0" y="416" font-size="12" text-anchor="middle" fill="#374151">(cel − start) × krzywa(t))</text>
<line x1="340" y1="380" x2="467" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<line x1="770" y1="380" x2="897" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/>
<path d="M1050.0,440 v40 h-430 v-40" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="660.0" y="494" font-size="12" text-anchor="middle" fill="#374151">Kolejny ząbek w ruchu: cel się przesuwa, krzywa hamowania</text>
<text x="40" y="540" font-size="13" fill="#374151">Inne wejścia (touchpad, klawisze, pasek) zostają WebKitowi; przewinięcie przez kogoś innego zatrzymuje animację.</text>
<rect x="40" y="568" width="22" height="16" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
<text x="72" y="581" font-size="12" fill="#374151">platforma</text>
<rect x="360" y="568" width="22" height="16" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="392" y="581" font-size="12" fill="#374151">logika decyzji i liczby</text>
<rect x="680" y="568" width="22" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="712" y="581" font-size="12" fill="#374151">stan i widok</text>
</svg>
